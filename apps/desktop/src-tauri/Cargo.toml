[package]
name = "sylph-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "sylph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
