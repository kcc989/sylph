version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "alchemy"
          - "wrangler"
          - "workerd"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
