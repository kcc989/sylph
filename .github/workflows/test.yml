name: Test

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - ".npmrc"
      - ".oxfmtrc.json"
      - "alchemy.run.ts"
      - "apps/**"
      - "bun.lock"
      - "lefthook.yml"
      - "oxlint.config.ts"
      - "package.json"
      - "packages/**"
      - "scripts/check-dependency-policy.mjs"
      - "tools/deployment/**"
      - "tools/worker-build/**"
      - "tools/template-contract/**"
      - "tools/resource-management/**"
      - "tools/wizard/**"
      - "scripts/deploy-*"
      - "scripts/setup.sh"
      - "tools/runtime-smoke/**"
      - "tools/release-smoke/**"
      - "scripts/release-smoke.mjs"
      - "scripts/setup-release-smoke.sh"
      - "tests/release-smoke/**"
      - "playwright.release-smoke.config.ts"
      - "tools/oxlint/**"
      - "tsconfig.json"
      - "turbo.json"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-test-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-test-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run check:workers
      - run: bun run smoke:workers
      - run: docker build -f packages/cursor-provider/Dockerfile -t sylph-cursor:test .
      - run: bun run smoke:runtime

  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-stories-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun --cwd packages/ui test:stories

  template:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Read the pinned template release
        id: release
        run: bun -e 'import { builtInTemplateRelease as release } from "./packages/domain/src/template-release.ts"; for (const [key, value] of Object.entries(release)) console.log(`${key}=${value}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.release.outputs.repository }}
          ref: ${{ steps.release.outputs.commit }}
          path: template-check
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.release.outputs.bunVersion }}
      - name: Verify the template release
        working-directory: template-check
        env:
          EXPECTED_TEMPLATE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); if (p.version !== process.env.EXPECTED_TEMPLATE_VERSION) throw new Error("Template version mismatch")'
          bun install --frozen-lockfile
          bun run format:check
          bun run typecheck
          bun run lint
          bun test
          bun run build
          bun ../tools/template-contract/verify.mjs .
          git diff --exit-code

  test:
    if: always()
    needs: [verification, stories, template]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          STORIES_RESULT: ${{ needs.stories.result }}
          TEMPLATE_RESULT: ${{ needs.template.result }}
        run: test "$VERIFICATION_RESULT" = success && test "$STORIES_RESULT" = success && test "$TEMPLATE_RESULT" = success
